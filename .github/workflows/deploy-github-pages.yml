name: Deploy web simulator to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "include/**"
      - "lib/**"
      - "data/**"
      - "tools/build_web.sh"
      - "tools/web_main.cpp"
      - "tools/web_shell.html"
      - "tools/web_demo/**"
      - "platformio.ini"
      - ".github/workflows/deploy-github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-native-${{ hashFiles('platformio.ini') }}

      - name: Install native build dependencies
        run: |
          python -m pip install platformio
          pio pkg install -e native

      - name: Build firmware for the browser
        run: ./tools/build_web.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
