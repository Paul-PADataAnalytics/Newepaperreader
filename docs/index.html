<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LilyGO T5-EPD47 E-Reader Simulator</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --text-color: #f8fafc;
            --text-dim: #94a3b8;
            --border-color: #334155;
            --device-bezel: #27272a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem;
        }

        header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.25rem;
        }

        header p {
            color: var(--text-dim);
            font-size: 0.95rem;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            max-width: 1040px;
            width: 100%;
        }

        .device-frame {
            background-color: var(--device-bezel);
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
            position: relative;
        }

        canvas.emscripten {
            border: none;
            background-color: #ffffff;
            display: block;
            border-radius: 4px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
            width: 960px;
            height: 540px;
        }

        @media (max-width: 1024px) {
            canvas.emscripten {
                width: 100%;
                height: auto;
                aspect-ratio: 960 / 540;
            }
        }

        .status-container {
            margin-top: 1rem;
            color: var(--text-dim);
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>LilyGO T5-EPD47 E-Reader Web Simulator</h1>
        <p>Interactive WebAssembly Demo of Firmware v2.2</p>
    </header>
    <div class="main-container">
        <div class="device-frame">
            <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
        </div>
        <div class="status-container" id="status">Loading WebAssembly engine...</div>
    </div>
    <script type="text/javascript">
        var statusElement = document.getElementById('status');
        var Module = {
            preRun: [],
            postRun: [],
            print: function(text) {
                console.log(text);
            },
            printErr: function(text) {
                console.error(text);
            },
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                canvas.addEventListener("webglcontextlost", function(e) { alert('WebGL context lost. Reload page.'); e.preventDefault(); }, false);
                return canvas;
            })(),
            setStatus: function(text) {
                if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
                if (text === Module.setStatus.last.text) return;
                statusElement.innerHTML = text;
            },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'System Ready');
            }
        };
        Module.setStatus('Downloading firmware...');
    </script>
    <script async type="text/javascript" src="index.js"></script>
</body>
</html>
