<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <title>LilyGO T5-EPD47 E-Reader Simulator</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #111827;
            color: #f9fafb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: clamp(1rem, 4vw, 2.5rem);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
        }

        header {
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.25rem, 4vw, 1.8rem);
        }

        header p {
            margin: 0.4rem 0 0;
            color: #cbd5e1;
        }

        main {
            width: min(100%, 588px);
        }

        .device-frame {
            width: 100%;
            padding: clamp(8px, 2.4vw, 24px);
            border: 1px solid #475569;
            border-radius: 16px;
            background: #27272a;
            box-shadow: 0 20px 50px #0008;
        }

        canvas.emscripten {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 540 / 960;
            border-radius: 4px;
            background: #fff;
            image-rendering: pixelated;
            touch-action: none;
        }

        canvas.emscripten:focus-visible {
            outline: 3px solid #60a5fa;
            outline-offset: 3px;
        }

        #status {
            min-height: 1.5em;
            color: #cbd5e1;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>LilyGO T5-EPD47 E-Reader Simulator</h1>
        <p>Browser build of the C++ firmware using WebAssembly</p>
    </header>
    <main>
        <div class="device-frame">
            <canvas class="emscripten" id="canvas" tabindex="0"
                    aria-label="Interactive e-reader firmware display"></canvas>
        </div>
        <p id="status" role="status" aria-live="polite">Loading firmware…</p>
    </main>
    <script>
        const statusElement = document.getElementById("status");
        const canvas = document.getElementById("canvas");
        canvas.addEventListener("contextmenu", (event) => event.preventDefault());
        canvas.addEventListener("webglcontextlost", (event) => {
            event.preventDefault();
            Module.setStatus("Graphics context lost. Reload the page to restart.");
        });

        var Module = {
            preRun: [],
            postRun: [],
            print: (...args) => console.log(...args),
            printErr: (...args) => console.error(...args),
            canvas,
            setStatus(text) {
                statusElement.textContent = text;
            },
            onAbort(reason) {
                this.setStatus(`Firmware failed to start: ${reason}`);
            },
            monitorRunDependencies(left) {
                this.totalDependencies = Math.max(this.totalDependencies || 0, left);
                this.setStatus(left
                    ? `Preparing firmware… (${this.totalDependencies - left}/${this.totalDependencies})`
                    : "Firmware running");
            }
        };
    </script>
    {{{ SCRIPT }}}
</body>
</html>
